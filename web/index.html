<!DOCTYPE html>
<html>
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Notencloud - Digitale Notenmappe für Blasorchester & Chöre">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121316">

  <!-- iOS / iPadOS Safari PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notencloud">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Notencloud</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121316;
      /* Prevent bounce scroll on iPad Safari when annotating */
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-x pan-y;
    }
  </style>
</head>
<body>
  <script>
    // Der Browser verschiebt die Seite, wenn ein Textfeld den Fokus bekommt
    // (Suche, Anmeldung, Bildschirmtastatur) – auch bei "overflow: hidden".
    // Flutter merkt das nicht: Die Knöpfe werden weiter an der alten Stelle
    // gezeichnet, reagieren aber versetzt (man muss darüber tippen).
    // Deshalb die Seite wieder an den Anfang schieben, sobald nichts mehr
    // eingegeben wird; am Rechner ohne Bildschirmtastatur sofort.
    (function () {
      var editing = false;
      var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      function isField(e) {
        var t = e.composedPath ? e.composedPath()[0] : e.target;
        return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      }
      function reset() {
        if (touch && editing) return;
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        var d = document.documentElement, b = document.body;
        if (d.scrollTop || d.scrollLeft) { d.scrollTop = 0; d.scrollLeft = 0; }
        if (b && (b.scrollTop || b.scrollLeft)) { b.scrollTop = 0; b.scrollLeft = 0; }
      }
      function later(ms) { return function () { setTimeout(reset, ms); }; }
      document.addEventListener('focusin', function (e) { if (isField(e)) editing = true; }, true);
      document.addEventListener('focusout', function (e) {
        if (!isField(e)) return;
        editing = false;
        setTimeout(reset, 100);
        setTimeout(reset, 500);
      }, true);
      window.addEventListener('scroll', later(0), { passive: true });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', later(150));
      window.addEventListener('orientationchange', later(400));
      window.addEventListener('pageshow', later(0));
    })();
  </script>
  <script>
    // Offline-Betrieb: App-Dateien im Browser vorhalten (siehe sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
