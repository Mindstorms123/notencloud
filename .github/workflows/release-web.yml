name: Web-Paket ans Release hängen

# Baut das Web-Paket für einfaches Webhosting und hängt es an das Release.
# install.php lädt es von dort:  …/releases/latest/download/notencloud-web.zip
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release, an das das Paket gehängt wird (z. B. v1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - name: Web-Paket bauen
        run: scripts/build_web.sh --ci "$TAG"

      - name: Einrichtung und Proxy prüfen
        run: test/hosting/run.sh

      - name: Ans Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/notencloud-web.zip build/install.php build/version.json --clobber
