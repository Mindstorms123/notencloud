name: Web-App auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      # GitHub Pages führt kein PHP aus. Die Adresse eines CORS-Proxys kommt
      # deshalb aus der Repository-Variable NOTENCLOUD_PROXY_URL
      # (Settings › Secrets and variables › Actions › Variables).
      - name: Web-App bauen
        env:
          PROXY_URL: ${{ vars.NOTENCLOUD_PROXY_URL }}
        run: |
          args=("--dart-define=NOTENCLOUD_BUILD=${GITHUB_SHA::8}")
          if [ -n "$PROXY_URL" ]; then
            args+=("--dart-define=NOTENCLOUD_PROXY_URL=$PROXY_URL")
          fi
          flutter build web --release "${args[@]}"
          rm -f build/web/proxy.php build/web/unzip.php build/web/.htaccess
          # Versionskennung an den App-Dateien und Dateiliste für den Offline-Betrieb.
          scripts/web_postbuild.sh "${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
